services:
  # Base de datos PostgreSQL con PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: emergency_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emergency_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Django
  backend:
    build: .
    container_name: emergency_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-emergency_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-this-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CHANNEL_REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  # Redis for Channels
  redis:
    image: redis:7
    container_name: emergency_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
